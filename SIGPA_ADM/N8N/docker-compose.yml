# Entorno local de n8n para SIGPA.
# Expone el webhook de rutas que llama el backend FastAPI (geocodifica y
# optimiza). No se conecta directo a Supabase ni escribe en la base.
#
# Uso: cp .env.example .env  (completar valores)  ->  docker compose up -d
# Despliegue en un host público (Render): ver Dockerfile y DESPLIEGUE.md.

services:
  n8n:
    # Versión fija de n8n: N8N_VERSION en el .env (la misma que usa el
    # Dockerfile). Sin ella docker compose se niega a arrancar.
    image: n8nio/n8n:${N8N_VERSION:?Definir N8N_VERSION en el .env (ver .env.example)}
    container_name: sigpa-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Depósito (DEPOT_LAT/DEPOT_LON), API key de ORS y demás variables del
    # workflow vienen solo del .env (nunca hardcodeadas aquí). El secreto
    # X-Route-Secret es una credencial de n8n, no una variable.
    env_file: .env
    environment:
      # Huso horario de Chile: lo usan los nodos Cron/Schedule de n8n.
      # Debe calzar con el manejo de hora de Chile del resto del proyecto.
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago
      # Permite usar {{ $env.X }} en los nodos (variables del .env).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      # Corte de 40 s por ejecución (el backend espera 45 s por defecto; ver DESPLIEGUE.md punto 7).
      - EXECUTIONS_TIMEOUT=40
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  n8n_data:
    name: sigpa_n8n_data
